workflows:
  android-release:
    name: Android Release Build
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      java: 21
      # Vite 7 requires Node >= 20.19; a bare "20" can resolve to an older
      # 20.x on Codemagic and make "Build web assets" fail with status 1.
      node: 20.20.0
      groups:
        - keystore_credentials
      vars:
        PACKAGE_NAME: "no.nestwork.vaktapp"
    scripts:
      - name: Set up code signing
        script: |
          echo $CM_KEYSTORE | base64 --decode > /tmp/nestwork.keystore
      - name: Fix Kotlin Duplicate Classes
        script: |
          echo "allprojects { configurations.all { exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
          exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8' } }" >> android/build.gradle
      - name: Install npm dependencies
        script: |
          # Deterministic install from the lockfile
          npm ci --no-audit --no-fund
          # Workaround for npm's optional-deps bug on macOS ARM (npm/cli#4828):
          # native binaries for rollup/esbuild sometimes aren't installed,
          # which makes "vite build" exit with status 1.
          node -e "require('@rollup/rollup-darwin-arm64')" 2>/dev/null || npm i --no-save @rollup/rollup-darwin-arm64
          node -e "require('@esbuild/darwin-arm64')" 2>/dev/null || npm i --no-save @esbuild/darwin-arm64
      - name: Build web assets
        script: npm run build
      - name: Sync Capacitor
        script: npx cap sync android
      - name: Set Android SDK location
        script: echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/android/local.properties"
      - name: Build Android App Bundle
        script: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=/tmp/nestwork.keystore \
            -Pandroid.injected.signing.store.password=$CM_KEYSTORE_PASSWORD \
            -Pandroid.injected.signing.key.alias=$CM_KEY_ALIAS \
            -Pandroid.injected.signing.key.password=$CM_KEY_PASSWORD
    artifacts:
      - android/app/build/outputs/**/*.aab
    publishing:
      email:
        recipients:
          - post@nestwork.no
        notify:
          success: true
          failure: true

  ios-release:
    name: iOS Release Build
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Codemagic
    environment:
      node: 20
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "no.nestwork.vaktapp"
    scripts:
      - name: Install npm dependencies
        script: npm install
      - name: Build web assets
        script: npm run build
      - name: Sync Capacitor
        script: |
          rm -rf ios
          npx cap add ios
          find ios -type f -name "Podfile" -exec sed -i '' "s/platform :ios, '[0-9.]*'/platform :ios, '15.0'/g" {} +
          find ios -type f -name "*.pbxproj" -exec sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*/IPHONEOS_DEPLOYMENT_TARGET = 15.0/g' {} +
          npx cap sync ios
      - name: Set Version and Build Number
        script: |
          PBXPROJ="ios/App/App.xcodeproj/project.pbxproj"
          sed -i '' 's/MARKETING_VERSION = [^;]*;/MARKETING_VERSION = 1.5;/g' "$PBXPROJ"
          sed -i '' 's/CURRENT_PROJECT_VERSION = [^;]*;/CURRENT_PROJECT_VERSION = 6;/g' "$PBXPROJ"
          echo "Version set to 1.5, build 6"
      - name: Add Push Notifications Capability
        script: |
          ENTITLEMENTS="ios/App/App/App.entitlements"
          cat > "$ENTITLEMENTS" << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>aps-environment</key>
            <string>production</string>
          </dict>
          </plist>
          EOF
          PBXPROJ="ios/App/App.xcodeproj/project.pbxproj"
          if ! grep -q "CODE_SIGN_ENTITLEMENTS" "$PBXPROJ"; then
            sed -i '' 's|PRODUCT_BUNDLE_IDENTIFIER = no.nestwork.vaktapp;|PRODUCT_BUNDLE_IDENTIFIER = no.nestwork.vaktapp;\n\t\t\t\tCODE_SIGN_ENTITLEMENTS = App/App.entitlements;|g' "$PBXPROJ"
          fi
          INFO_PLIST="ios/App/App/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" "$INFO_PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:0 string remote-notification" "$INFO_PLIST" 2>/dev/null || true
          echo "Push Notifications capability added"
      - name: Install CocoaPods
        script: |
          cd ios/App
          pod install
      - name: Keychain initialize
        script: keychain initialize
      - name: Signing Setup
        script: |
          openssl genrsa -out /tmp/ios_dist.key 2048
          keychain add-certificates --key /tmp/ios_dist.key
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
          keychain add-certificates
      - name: Inject Signing into Xcode Project
        script: |
          PROFILE_PATH=$(ls ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision 2>/dev/null | head -1)
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" /dev/stdin <<< $(/usr/bin/security cms -D -i "$PROFILE_PATH"))
          TEAM_ID=$(/usr/libexec/PlistBuddy -c "Print TeamIdentifier:0" /dev/stdin <<< $(/usr/bin/security cms -D -i "$PROFILE_PATH"))
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print Name" /dev/stdin <<< $(/usr/bin/security cms -D -i "$PROFILE_PATH"))
          SIGNING_IDENTITY=$(security find-identity -v -p codesigning | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "Profile: $PROFILE_NAME"
          echo "UUID: $PROFILE_UUID"
          echo "Team: $TEAM_ID"
          echo "Identity: $SIGNING_IDENTITY"
          PBXPROJ="ios/App/App.xcodeproj/project.pbxproj"
          ruby -e "
            content = File.read('$PBXPROJ')
            content.gsub!(/DEVELOPMENT_TEAM = [^;]*;/, 'DEVELOPMENT_TEAM = $TEAM_ID;')
            content.gsub!(/CODE_SIGN_STYLE = [^;]*;/, 'CODE_SIGN_STYLE = Manual;')
            content.gsub!(/\"CODE_SIGN_IDENTITY\[sdk=iphoneos\*\]\" = [^;]*;/, '\"CODE_SIGN_IDENTITY[sdk=iphoneos*]\" = \"$SIGNING_IDENTITY\";')
            content.gsub!(/PRODUCT_BUNDLE_IDENTIFIER = [^;]*;/, 'PRODUCT_BUNDLE_IDENTIFIER = $BUNDLE_ID;')
            content.gsub!(/PROVISIONING_PROFILE_SPECIFIER = [^;]*;/, 'PROVISIONING_PROFILE_SPECIFIER = \"$PROFILE_NAME\";')
            unless content.include?('PROVISIONING_PROFILE_SPECIFIER')
              content.gsub!(/PRODUCT_BUNDLE_IDENTIFIER = #{Regexp.escape('$BUNDLE_ID')};/) do |m|
                m + \"\n\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = \\\"$PROFILE_NAME\\\";\"
              end
            end
            File.write('$PBXPROJ', content)
          "
          echo "Signing injected into pbxproj"
      - name: Archive iOS App
        script: |
          xcodebuild \
            -workspace "$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -archivePath build/ios/App.xcarchive \
            archive \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$(PROFILE_PATH=$(ls ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision | head -1) && /usr/libexec/PlistBuddy -c 'Print TeamIdentifier:0' /dev/stdin <<< $(/usr/bin/security cms -D -i "$PROFILE_PATH"))"
      - name: Export IPA
        script: |
          PROFILE_PATH=$(ls ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision | head -1)
          TEAM_ID=$(/usr/libexec/PlistBuddy -c "Print TeamIdentifier:0" /dev/stdin <<< $(/usr/bin/security cms -D -i "$PROFILE_PATH"))
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print Name" /dev/stdin <<< $(/usr/bin/security cms -D -i "$PROFILE_PATH"))
          cat > build/ios/ExportOptions.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>$TEAM_ID</string>
            <key>uploadSymbols</key>
            <true/>
            <key>provisioningProfiles</key>
            <dict>
              <key>$BUNDLE_ID</key>
              <string>$PROFILE_NAME</string>
            </dict>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath build/ios/App.xcarchive \
            -exportPath build/ios/ipa \
            -exportOptionsPlist build/ios/ExportOptions.plist
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
